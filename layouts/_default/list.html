{{ define "main" }}
<article class="artikel">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{- with .Pages }}
  <ul class="liste">
    {{- range . }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Description }}<span>{{ . }}</span>{{ end }}</li>
    {{- end }}
  </ul>
  {{- end }}
</article>
{{ end }}

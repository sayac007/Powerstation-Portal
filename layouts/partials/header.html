<header class="kopf">
  <a class="schild" href="{{ site.Home.RelPermalink }}">
    <span class="schild-titel">{{ site.Title }}</span>
    <span class="schild-unter">{{ site.Params.tagline }}</span>
  </a>
  <img class="ornament" src="{{ "ornament.svg" | relURL }}" alt="" width="240" height="24">
  <nav class="navigation" aria-label="{{ i18n "nav" }}">
    <ul>
      {{- range site.Menus.main }}
      <li><a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </nav>
  <div class="werkzeuge">
    <div id="suche" class="suche" role="search" aria-label="{{ i18n "search" }}"></div>
    <ul class="sprachen" aria-label="{{ i18n "languages" }}">
      {{- range .AllTranslations }}
      <li><a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}" title="{{ .Language.LanguageName }}"{{ if eq .Language.Lang $.Language.Lang }} aria-current="true"{{ end }}>{{ .Language.Lang | upper }}</a></li>
      {{- end }}
    </ul>
  </div>
</header>

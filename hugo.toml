# Platzhalter-Domain – vor Veröffentlichung ersetzen
baseURL = "https://example.org/"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
title = "Powerstation-Portal"

[markup.goldmark.renderer]
  unsafe = false

# ---------- Sprachen ----------
[languages.de]
  languageName = "Deutsch"
  languageCode = "de-DE"
  contentDir = "content/de"
  weight = 1
  [languages.de.params]
    tagline = "Erfahrung · Messung · Reparatur"
    description = "Powerstationen aus eigener Erfahrung: Einsatz, Reparatur und unabhängige Tests mit eigenen Messwerten."

[languages.en]
  languageName = "English"
  languageCode = "en"
  contentDir = "content/en"
  weight = 2
  [languages.en.params]
    tagline = "Experience · Measurement · Repair"
    description = "Portable power stations from first-hand experience: use, repair and independent tests with our own measurements."

[languages.ru]
  languageName = "Русский"
  languageCode = "ru"
  contentDir = "content/ru"
  weight = 3
  [languages.ru.params]
    tagline = "Опыт · Измерения · Ремонт"
    description = "Портативные электростанции на основе собственного опыта: применение, ремонт и независимые тесты с собственными измерениями."

[languages.uk]
  languageName = "Українська"
  languageCode = "uk"
  contentDir = "content/uk"
  weight = 4
  [languages.uk.params]
    tagline = "Досвід · Вимірювання · Ремонт"
    description = "Портативні електростанції з власного досвіду: застосування, ремонт і незалежні тести з власними вимірюваннями."

[languages.it]
  languageName = "Italiano"
  languageCode = "it"
  contentDir = "content/it"
  weight = 5
  [languages.it.params]
    tagline = "Esperienza · Misure · Riparazione"
    description = "Power station portatili per esperienza diretta: utilizzo, riparazione e test indipendenti con misure proprie."

